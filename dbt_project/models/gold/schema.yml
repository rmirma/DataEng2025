models:
  - name: FactVoting
    description: "Central fact table recording all parliamentary voting sessions. Each row represents one voting event with attendance and result metrics linked to weather and date dimensions."
    columns:
      - name: VotingId
        description: "Unique surrogate key for each voting session, auto-generated for warehouse identification."
        data_tests:
          - not_null
          - unique
      - name: VotingSrcId
        description: "Original source system identifier for the voting, used for data lineage and reconciliation."
      - name: VotingType
        description: "Foreign key referencing DimVotingType. Indicates the category of vote (e.g., procedural, legislative)."
        data_tests:
          - not_null
          - relationships:
              to: ref('DimVotingType')
              field: VotingType
      - name: WeatherId
        description: "Foreign key referencing DimWeather. Links voting to weather conditions in the 6 hours prior."
        data_tests:
          - not_null
          - relationships:
              to: ref('DimWeather')
              field: WeatherId
      - name: Date
        description: "Foreign key referencing DimDate. The calendar date when the voting took place."
        data_tests:
          - not_null
          - relationships:
              to: ref('DimDate')
              field: Date
      - name: StartTime
        description: "Timestamp when the voting session began."
      - name: EndTime
        description: "Timestamp when the voting session concluded."
      - name: VotingDescription
        description: "Free-text summary explaining the purpose and subject matter of the vote."
      - name: Present
        description: "Count of parliament members physically present during the voting session."
        data_tests:
          - not_null
      - name: Absent
        description: "Count of parliament members who did not attend the voting session."
      - name: InFavour
        description: "Count of parliament members who voted yes to support the motion."
      - name: Against
        description: "Count of parliament members who voted no to oppose the motion."
      - name: Neutral
        description: "Count of parliament members who abstained from voting on the motion."

  - name: DimWeather
    description: "Weather dimension capturing aggregated meteorological conditions over the 6-hour window before each voting session. Used for analyzing weather impact on parliamentary activity."
    columns:
      - name: WeatherId
        description: "Unique surrogate key for each weather observation period."
        data_tests:
          - unique
          - not_null
      - name: StartTime
        description: "Start timestamp of the 6-hour weather observation window."
      - name: EndTime
        description: "End timestamp of the 6-hour weather observation window."
      - name: AvgTemp
        description: "Mean temperature in Celsius averaged over the 6-hour period."
      - name: HighTemp
        description: "Maximum temperature in Celsius recorded during the 6-hour period."
      - name: LowTemp
        description: "Minimum temperature in Celsius recorded during the 6-hour period."
      - name: AvgPrecipitation
        description: "Mean precipitation in millimeters averaged over the 6-hour period."
      - name: MaxPrecipitation
        description: "Peak precipitation in millimeters during the 6-hour period."
      - name: AvgWindSpeed
        description: "Mean wind speed in meters per second over the 6-hour period."
      - name: MaxWindSpeed
        description: "Peak wind speed in meters per second during the 6-hour period."
      - name: AvgCloudiness
        description: "Mean cloud coverage percentage over the 6-hour period."

  - name: DimDate
    description: "Calendar dimension providing date attributes for time-based analysis of voting patterns across weekdays, months, seasons, and holidays."
    columns:
      - name: Date
        description: "Primary key representing a unique calendar date in YYYY-MM-DD format."
        data_tests:
          - unique
          - not_null
      - name: WeekDay
        description: "Name of the day of the week (Monday through Sunday)."
      - name: HolidayInd
        description: "Boolean flag indicating whether this date is an official public holiday."
      - name: HolidayDesc
        description: "Name or description of the holiday if applicable, otherwise empty."
      - name: Year
        description: "Four-digit calendar year."
      - name: Month
        description: "Calendar month as a number from 1 (January) to 12 (December)."
      - name: Season
        description: "Meteorological season: Winter, Spring, Summer, or Autumn."

  - name: DimVotingType
    description: "Voting type dimension categorizing different kinds of parliamentary votes for trend analysis."
    columns:
      - name: VotingType
        description: "Unique surrogate key identifying each voting category."
        data_tests:
          - unique
          - not_null
      - name: VotingTypeDesc
        description: "Human-readable label describing the voting category."