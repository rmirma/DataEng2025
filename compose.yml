services:
  # --- Airflow metadata database ---
  airflow-db:
    container_name: airflow-db
    image: postgres:16.4
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata_airflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
    restart: always


  # # --- pgAdmin UI for both databases ---
  # pgadmin:
  #   container_name: pgadmin
  #   image: elestio/pgadmin:REL-8_10
  #   env_file:
  #     - .env
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - airflow-db

  # --- Airflow Webserver ---
  airflow-webserver:
    build: .
    container_name: airflow-webserver
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    depends_on:
      - airflow-init
      - airflow-db
    restart: always

  # --- Airflow Scheduler ---
  airflow-scheduler:
    build: .
    container_name: airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    depends_on:
      - airflow-init
      - airflow-db
    restart: always

  # --- Airflow DB initialization & user setup ---
  airflow-init:
    build: .
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    depends_on:
      - airflow-db
    restart: "no"

# --- ClickHouse Server ---
  # One-shot initializer to fix permissions on the host-mounted ClickHouse data
  # directory before the server starts. This is idempotent and runs as root.
  # It helps avoid "rename: Permission denied" errors on bind mounts (dev only).
  clickhouse-init:
    image: clickhouse/clickhouse-server
    container_name: clickhouse-init
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R clickhouse:clickhouse /var/lib/clickhouse || true"]
    volumes:
      - clickhouse_data:/var/lib/clickhouse/
    restart: "no"

  # --- ClickHouse Server ---
  # Use a Docker-managed volume for data to avoid Windows permission issues
  clickhouse-server:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    env_file:
      - .env
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native client interface
    volumes:
      # Docker-managed volume for ClickHouse data (Linux-native, avoids rename issues)
      - clickhouse_data:/var/lib/clickhouse
      # Local CSVs or SQL files for testing/ingestion
      - ./sample_data:/var/lib/clickhouse/user_files
      - ./sql:/sql
      - ./clickhouse/init:/docker-entrypoint-initdb.d

    ulimits:
      nofile:
        soft: 262144
        hard: 262144


  dbt:
    # dbt container for building and testing ClickHouse models
    build:
      context: .               # Build context is the current directory
      dockerfile: dbt/Dockerfile  # Use the Dockerfile in this directory to build dbt image
    container_name: dbt
    depends_on:
      - clickhouse-server      # Ensure ClickHouse starts before dbt
    volumes:
      - ./sample_data:/var/lib/clickhouse/user_files # Shared folder for input files
      - ./sql:/sql                                  # Shared SQL scripts
      - ./dbt:/dbt                                  # Mount local dbt project directory
    working_dir: /dbt         # Set dbt project directory as the working directory
    command: ["dbt", "run"]   # Auto-run dbt models on startup
    restart: "no"             # Don't restart after dbt completes
# Optional one-shot initializer to fix permissions (not needed with Docker volume)
# clickhouse-init can be removed when using Docker volumes

volumes:
  # Docker-managed volume replaces the Windows-mounted folder
  clickhouse_data:
  pgdata_airflow:
