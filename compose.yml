services:
  # ============================================
  # AIRFLOW SERVICES
  # ============================================

  # --- Airflow metadata database ---
  airflow-db:
    container_name: airflow-db
    image: postgres:16.4
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow" ]
      interval: 10s
      retries: 5
    restart: always

  # --- pgAdmin UI ---
  pgadmin:
    container_name: pgadmin
    image: elestio/pgadmin:REL-8_10
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - airflow-db

  # --- Airflow Webserver ---
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: apache/airflow:2.8.1-custom
    container_name: airflow-webserver
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    ports:
      - "8080:8080"
    volumes:
      - airflow-dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - airflow-data:/opt/airflow/data
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  # --- Airflow Scheduler ---
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: apache/airflow:2.8.1-custom
    container_name: airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - airflow-dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - airflow-data:/opt/airflow/data
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  # --- Airflow DB initialization & user setup ---
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: apache/airflow:2.8.1-custom
    container_name: airflow-init
    command: [ "bash", "-c", "airflow db init && airflow users create --username $${AIRFLOW_DB_USER:-admin} --password $${AIRFLOW_DB_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email admin@example.com" ]
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    volumes:
      - airflow-dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - airflow-data:/opt/airflow/data
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  # ============================================
  # CLICKHOUSE SERVICES
  # ============================================

  # --- ClickHouse Server ---
  clickhouse-server:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    env_file:
      - .env
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native client interface
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-user-files:/var/lib/clickhouse/user_files
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [ "CMD", "clickhouse-client", "--query", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # --- ClickHouse Server for OpenMetadata ---
  clickhouse-server-omd:
    image: clickhouse/clickhouse-server
    container_name: clickhouse-server-omd
    env_file:
      - .env
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8124:8123" # HTTP interface
      - "9001:9000" # Native client interface
    volumes:
      - clickhouse-omd-data:/var/lib/clickhouse
      - clickhouse-omd-user-files:/var/lib/clickhouse/user_files
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # --- dbt container ---
  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: dbt
    depends_on:
      - clickhouse-server
    volumes:
      - dbt-project:/dbt
      - clickhouse-user-files:/var/lib/clickhouse/user_files
    working_dir: /dbt
    entrypoint: [ "/usr/local/bin/dbt" ]
    command: [ "test", "--profiles-dir", "/dbt" ]
    tty: true

  # ============================================
  # SUPERSET SERVICES
  # ============================================

  # --- Redis for Superset caching ---
  superset-redis:
    image: redis:7
    container_name: superset-redis
    volumes:
      - superset-redis-data:/data
    restart: always

  # --- PostgreSQL for Superset metadata ---
  superset-db:
    image: postgres:16
    container_name: superset-db
    env_file:
      - .env
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U superset" ]
      interval: 10s
      retries: 5
    restart: always

  # --- Superset initialization ---
  superset-init:
    image: apachesuperset.docker.scarf.sh/apache/superset:latest
    container_name: superset-init
    command: >
      bash -c "
        pip install --no-cache-dir clickhouse-connect &&
        superset db upgrade &&
        superset fab create-admin --username admin --email admin@superset.com --password admin --firstname Superset --lastname Admin || true &&
        superset init
      "
    environment:
      DATABASE_DB: superset
      DATABASE_HOST: superset-db
      DATABASE_PASSWORD: superset
      DATABASE_USER: superset
      DATABASE_PORT: 5432
      DATABASE_DIALECT: postgresql
      REDIS_HOST: superset-redis
      REDIS_PORT: 6379
      SUPERSET_SECRET_KEY: SUp3r$3cReT_kEy_f0R_dAtA_eNg1n33RiNg_Pr0j3cT_2025!
      PYTHONPATH: /app/pythonpath
      SUPERSET_LOAD_EXAMPLES: "no"
    depends_on:
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_started
    user: "root"
    volumes:
      - superset-home:/app/superset_home
    healthcheck:
      disable: true
    restart: "no"

  # --- Superset App ---
  superset:
    image: apachesuperset.docker.scarf.sh/apache/superset:latest
    container_name: superset-app
    command: >
      bash -c "
        pip install --no-cache-dir clickhouse-connect &&
        gunicorn --bind 0.0.0.0:8088 --access-logfile - --error-logfile - --workers 2 --worker-class gthread --threads 20 --timeout 60 --limit-request-line 0 --limit-request-field_size 0 'superset.app:create_app()'
      "
    environment:
      DATABASE_DB: superset
      DATABASE_HOST: superset-db
      DATABASE_PASSWORD: superset
      DATABASE_USER: superset
      DATABASE_PORT: 5432
      DATABASE_DIALECT: postgresql
      REDIS_HOST: superset-redis
      REDIS_PORT: 6379
      SUPERSET_SECRET_KEY: SUp3r$3cReT_kEy_f0R_dAtA_eNg1n33RiNg_Pr0j3cT_2025!
      PYTHONPATH: /app/pythonpath
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      clickhouse-server:
        condition: service_healthy
    user: "root"
    volumes:
      - superset-home:/app/superset_home
    restart: always

  # --- Superset Celery Worker ---
  superset-worker:
    image: apachesuperset.docker.scarf.sh/apache/superset:latest
    container_name: superset-worker
    command: >
      bash -c "
        pip install --no-cache-dir clickhouse-connect &&
        celery --app=superset.tasks.celery_app:app worker --pool=prefork -O fair -c 4
      "
    environment:
      DATABASE_DB: superset
      DATABASE_HOST: superset-db
      DATABASE_PASSWORD: superset
      DATABASE_USER: superset
      DATABASE_PORT: 5432
      DATABASE_DIALECT: postgresql
      REDIS_HOST: superset-redis
      REDIS_PORT: 6379
      SUPERSET_SECRET_KEY: SUp3r$3cReT_kEy_f0R_dAtA_eNg1n33RiNg_Pr0j3cT_2025!
      PYTHONPATH: /app/pythonpath
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    volumes:
      - superset-home:/app/superset_home
    healthcheck:
      test: [ "CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME" ]
    restart: always

  # --- Superset Celery Beat ---
  superset-worker-beat:
    image: apachesuperset.docker.scarf.sh/apache/superset:latest
    container_name: superset-worker-beat
    command: >
      bash -c "
        pip install --no-cache-dir clickhouse-connect &&
        celery --app=superset.tasks.celery_app:app beat --pidfile /tmp/celerybeat.pid --schedule /tmp/celerybeat-schedule
      "
    environment:
      DATABASE_DB: superset
      DATABASE_HOST: superset-db
      DATABASE_PASSWORD: superset
      DATABASE_USER: superset
      DATABASE_PORT: 5432
      DATABASE_DIALECT: postgresql
      REDIS_HOST: superset-redis
      REDIS_PORT: 6379
      SUPERSET_SECRET_KEY: SUp3r$3cReT_kEy_f0R_dAtA_eNg1n33RiNg_Pr0j3cT_2025!
      PYTHONPATH: /app/pythonpath
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    volumes:
      - superset-home:/app/superset_home
    healthcheck:
      disable: true
    restart: always

  # ============================================
  # OPENMETADATA SERVICES
  # ============================================

  # --- Elasticsearch for OpenMetadata ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  # --- MySQL for OpenMetadata ---
  mysql:
    image: docker.getcollate.io/openmetadata/db:1.4.0
    container_name: mysql
    command: "--sort_buffer_size=10M"
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --silent --execute "use openmetadata_db"
      interval: 15s
      timeout: 10s
      retries: 10
    restart: always

  # --- OpenMetadata Migration ---
  openmetadata-migrate:
    image: openmetadata/server:1.4.0
    container_name: openmetadata-migrate
    command: "./bootstrap/bootstrap_storage.sh migrate-all"
    env_file:
      - .env
    environment:
      OPENMETADATA_CLUSTER_NAME: openmetadata
      SERVER_PORT: 8585
      SERVER_ADMIN_PORT: 8586
      LOG_LEVEL: INFO
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: '["all"]'
      AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
      AUTHORIZER_PRINCIPAL_DOMAIN: "open-metadata.org"
      AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN: "false"
      AUTHORIZER_ENABLE_SECURE_SOCKET: "false"
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_PUBLIC_KEYS: "[http://localhost:8585/api/v1/system/config/jwks]"
      AUTHENTICATION_AUTHORITY: "https://accounts.google.com"
      AUTHENTICATION_CLIENT_ID: ""
      AUTHENTICATION_CALLBACK_URL: ""
      AUTHENTICATION_JWT_PRINCIPAL_CLAIMS: "[email,preferred_username,sub]"
      AUTHENTICATION_ENABLE_SELF_SIGNUP: "true"
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_SCHEME: mysql
      DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      DB_USER_PASSWORD: openmetadata_password
      OM_DATABASE: openmetadata_db
      SEARCH_TYPE: elasticsearch
      PIPELINE_SERVICE_CLIENT_ENABLED: "true"
      PIPELINE_SERVICE_CLIENT_ENDPOINT: "http://openmetadata-ingestion:8080"
      PIPELINE_SERVICE_CLIENT_CLASS_NAME: "org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient"
      SERVER_HOST_API_URL: "http://openmetadata-server:8585/api"
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: admin
    depends_on:
      elasticsearch:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: "no"

  # --- OpenMetadata Server ---
  openmetadata-server:
    image: openmetadata/server:1.4.0
    container_name: openmetadata-server
    env_file:
      - .env
    environment:
      OPENMETADATA_CLUSTER_NAME: openmetadata
      SERVER_PORT: 8585
      SERVER_ADMIN_PORT: 8586
      LOG_LEVEL: INFO
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: '["all"]'
      AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
      AUTHORIZER_PRINCIPAL_DOMAIN: "open-metadata.org"
      AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN: "false"
      AUTHORIZER_ENABLE_SECURE_SOCKET: "false"
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_PUBLIC_KEYS: "[http://localhost:8585/api/v1/system/config/jwks]"
      AUTHENTICATION_AUTHORITY: "https://accounts.google.com"
      AUTHENTICATION_CLIENT_ID: ""
      AUTHENTICATION_CALLBACK_URL: ""
      AUTHENTICATION_JWT_PRINCIPAL_CLAIMS: "[email,preferred_username,sub]"
      AUTHENTICATION_ENABLE_SELF_SIGNUP: "true"
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_SCHEME: mysql
      DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      DB_USER_PASSWORD: openmetadata_password
      OM_DATABASE: openmetadata_db
      SEARCH_TYPE: elasticsearch
      PIPELINE_SERVICE_CLIENT_ENABLED: "true"
      PIPELINE_SERVICE_CLIENT_ENDPOINT: "http://openmetadata-ingestion:8080"
      PIPELINE_SERVICE_CLIENT_CLASS_NAME: "org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient"
      SERVER_HOST_API_URL: "http://openmetadata-server:8585/api"
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: admin
    ports:
      - "8585:8585"
      - "8586:8586"
    depends_on:
      elasticsearch:
        condition: service_healthy
      mysql:
        condition: service_healthy
      openmetadata-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8585/api/v1/system/version || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  # --- OpenMetadata Ingestion (Airflow) ---
  openmetadata-ingestion:
    image: docker.getcollate.io/openmetadata/ingestion:1.4.0
    container_name: openmetadata-ingestion
    depends_on:
      mysql:
        condition: service_healthy
      openmetadata-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: "/opt/airflow/dag_generated_configs"
      DB_HOST: mysql
      DB_PORT: 3306
      AIRFLOW_DB: airflow_db
      DB_SCHEME: mysql+mysqldb
      DB_USER: airflow_user
      DB_PASSWORD: airflow_pass
    entrypoint: /bin/bash
    command:
      - "/opt/airflow/ingestion_dependency.sh"
    expose:
      - 8080
    ports:
      - "8081:8080"
    volumes:
      - ingestion-volume-dag-airflow:/opt/airflow/dag_generated_configs
      - ingestion-volume-dags:/opt/airflow/dags
      - ingestion-volume-tmp:/tmp
    restart: always

# ============================================
# DOCKER-MANAGED VOLUMES
# ============================================
volumes:
  # Airflow volumes
  airflow-db-data:
  airflow-dags:
  airflow-logs:
  airflow-data:

  # ClickHouse volumes
  clickhouse-data:
  clickhouse-user-files:
  clickhouse-omd-data:
  clickhouse-omd-user-files:

  # dbt volume
  dbt-project:

  # Superset volumes
  superset-redis-data:
  superset-db-data:
  superset-home:

  # OpenMetadata volumes
  es-data:
  mysql-data:
  ingestion-volume-dag-airflow:
  ingestion-volume-dags:
  ingestion-volume-tmp:
